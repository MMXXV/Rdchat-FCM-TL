name: Verify RdChat FCM Worker

on:
  push:
    branches: [main]
    paths:
      - "rdchat-fcm-worker/**"
      - ".github/workflows/verify-fcm-worker.yml"
  pull_request:
    paths:
      - "rdchat-fcm-worker/**"
      - ".github/workflows/verify-fcm-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe JavaScript do Worker
        working-directory: rdchat-fcm-worker
        run: npm run check

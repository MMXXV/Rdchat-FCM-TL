name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;36.0.0"
      - name: Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

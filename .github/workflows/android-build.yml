name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 37
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0"
      - name: Verify official Gradle Wrapper JAR
        run: echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

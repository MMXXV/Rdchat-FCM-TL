name: Materialize canonical RdChat HTML once

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"

permissions:
  contents: write

concurrency:
  group: rdchat-canonical-html-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 37 SDK
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Generate the current, fully patched HTML from the existing Gradle pipeline
        run: ./gradlew --no-daemon :app:prepareRdchatAssets

      - name: Promote generated HTML to the single canonical source and remove build-time patching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path("app/build/generated/rdchatAssets/index.html")
          source_path = Path("app/src/main/assets/index.html")
          gradle_path = Path("app/build.gradle.kts")
          if not html_path.is_file():
              raise SystemExit("HTML gerado não encontrado; a migração foi cancelada.")
          html = html_path.read_text(encoding="utf-8")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: esperado 1 trecho, encontrado {count}. Nenhum arquivo fonte foi alterado.")
              return source.replace(old, new, 1)

          html = replace_once(
              html,
              "const sent = await operation;\\n      if (!sent) return;",
              "const sent = await operation;\\n      if (!sent) {\\n        if (!input.value.trim()) input.value = text;\\n        toggleSendButton();\\n        resizeMsgInput();\\n        return;\\n      }",
              "preservação do texto quando postBubble retorna null"
          )
          html = replace_once(
              html,
              "if(typeof window.RdChatReceiveFirebaseText==='function')window.RdChatReceiveFirebaseText(remote);if(!d.fileId)ack({chatId:d.chatId,msgId:d.tgMessageId})",
              "if(typeof window.RdChatReceiveFirebaseText==='function'){var accepted=window.RdChatReceiveFirebaseText(remote);if(!d.fileId)Promise.resolve(accepted).then(function(){ack({chatId:d.chatId,msgId:d.tgMessageId})},function(e){console.warn('RdChat TDLib: mensagem não persistida; recibo não enviado.',e)})}",
              "recibo TDLib após persistência local"
          )
          html = replace_once(
              html,
              "if (incomingFirebaseTextIds.has(String(remote.id)) || msgStore.has(String(remote.id))) return;",
              "if (incomingFirebaseTextIds.has(String(remote.id)) || msgStore.has(String(remote.id))) return;\\n    const persistedDuplicate = await dbGet('msgs', String(remote.id)).catch(() => null);\\n    if (persistedDuplicate) { incomingFirebaseTextIds.add(String(remote.id)); return; }",
              "deduplicação de mensagens recuperadas do histórico"
          )
          required = ["rdchat-v106-js", "rdchat-family-safety-runtime-v3-local-dob", "rd-login-field-icon", "window.RdChatTdlib"]
          missing = [marker for marker in required if marker not in html]
          if missing:
              raise SystemExit("O HTML materializado não contém marcadores esperados: " + ", ".join(missing))
          source_path.write_text(html, encoding="utf-8", newline="")

          gradle = gradle_path.read_text(encoding="utf-8")
          start_marker = "val generatedRdchatAssets ="
          end_marker = "\\nandroid {"
          if gradle.count(start_marker) != 1 or gradle.count(end_marker) != 1:
              raise SystemExit("Bloco de geração Gradle não pôde ser identificado unicamente.")
          start = gradle.index(start_marker)
          end = gradle.index(end_marker, start)
          gradle = gradle[:start] + gradle[end + 1:]
          gradle = replace_once(
              gradle,
              '    sourceSets.getByName("main").assets.setSrcDirs(listOf(generatedRdchatAssets))\\n',
              "",
              "origem de assets Android"
          )
          gradle = replace_once(
              gradle,
              "    dependsOn(prepareRdchatAssets, verifyTelegramApiCredentials)",
              "    dependsOn(verifyTelegramApiCredentials)",
              "dependência preBuild"
          )
          if "replaceExactlyOnce" in gradle or "prepareRdchatAssets" in gradle or "generatedRdchatAssets" in gradle:
              raise SystemExit("Ainda existem patches de HTML no Gradle após a limpeza.")
          gradle_path.write_text(gradle, encoding="utf-8", newline="")
          print(f"HTML canônico materializado: {source_path.stat().st_size} bytes")
          print(f"Gradle simplificado: {len(gradle.splitlines())} linhas")
          PY

      - name: Remove this one-time migration workflow and commit
        run: |
          rm .github/workflows/materialize-canonical-html.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html app/build.gradle.kts .github/workflows/materialize-canonical-html.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para materializar."
          else
            git commit -m "build: materialize canonical RdChat HTML asset"
            git push
          fi

name: Deploy RdChat FCM + Telegram Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar secrets obrigatórios
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Falta o secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Falta o secret CLOUDFLARE_ACCOUNT_ID}"
          : "${FIREBASE_SERVICE_ACCOUNT:?Falta o secret FIREBASE_SERVICE_ACCOUNT}"
          : "${TELEGRAM_BOT_TOKEN:?Falta o secret TELEGRAM_BOT_TOKEN}"
          : "${TELEGRAM_CHANNEL_ID:?Falta o secret TELEGRAM_CHANNEL_ID}"
      - name: Cadastrar secrets do Worker no Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx --yes wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT --config rdchat-fcm-worker/wrangler.toml
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4 secret put TELEGRAM_BOT_TOKEN --config rdchat-fcm-worker/wrangler.toml
          printf '%s' "$TELEGRAM_CHANNEL_ID" | npx --yes wrangler@4 secret put TELEGRAM_CHANNEL_ID --config rdchat-fcm-worker/wrangler.toml
      - name: Publicar Worker
        run: npx --yes wrangler@4 deploy --config rdchat-fcm-worker/wrangler.toml
